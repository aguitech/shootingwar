<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>SHOOTING WAR — Destroza Criaturas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-row">
    <div class="hud-box">💀 KILLS <span id="kills">0</span></div>
    <div class="hud-box">⚡ WAVE <span id="wave">1</span></div>
    <div class="hud-box">❤️ HP <span id="hp">100</span></div>
  </div>
  <div class="hud-row">
    <div class="hud-box">🔫 AMMO <span id="ammo">∞</span></div>
    <div class="hud-box">⭐ SCORE <span id="score">0</span></div>
  </div>
</div>

<div id="title-screen">
  <h1 class="title-glitch">SHOOTING<br>WAR</h1>
  <p class="subtitle">💥 Destroza Criaturas. Que Exploten. 💥</p>
  <button id="btn-start" class="big-btn">▶ START</button>
  <p class="controls-hint">
    🖥️ WASD moverse • Mouse apuntar • Click disparar<br>
    📱 Joystick MOVE • Botón rojo FIRE disparar
  </p>
</div>

<div id="game-over">
  <h1 class="go-title">GAME OVER</h1>
  <p>Lograste <span id="go-kills">0</span> kills</p>
  <p>Score: <span id="go-score">0</span></p>
  <button id="btn-restart" class="big-btn">↻ TRY AGAIN</button>
</div>

<div id="touch-controls">
  <div id="joy-move" class="joy-base">
    <div class="joy-stick"></div>
    <div class="joy-label">MOVE</div>
  </div>
  <button id="btn-fire" class="action-btn">🔥</button>
  <button id="btn-reload" class="action-btn">↻</button>
</div>

<script src="game.js"></script>
</body>
</html>
